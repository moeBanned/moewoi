<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tên website</title>
  <meta name="description" content="Mô tả ngắn về website">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">Logo</a>
      <nav class="nav">
        <a href="#gioi-thieu">Giới thiệu</a>
        <a href="#dich-vu">Dịch vụ</a>
        <a href="#lien-he">Liên hệ</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Tiêu đề chính của trang</h1>
        <p>Một câu mô tả ngắn gọn về website của bạn.</p>
        <a href="#lien-he" class="btn">Liên hệ ngay</a>
      </div>
    </section>

    <section id="gioi-thieu" class="section">
      <div class="container">
        <h2>Giới thiệu</h2>
        <p>Nội dung giới thiệu.</p>
      </div>
    </section>

    <section id="dich-vu" class="section section-alt">
      <div class="container">
        <h2>Dịch vụ</h2>
        <div class="grid">
          <article class="card">
            <h3>Mục 1</h3>
            <p>Mô tả mục 1.</p>
          </article>
          <article class="card">
            <h3>Mục 2</h3>
            <p>Mô tả mục 2.</p>
          </article>
          <article class="card">
            <h3>Mục 3</h3>
            <p>Mô tả mục 3.</p>
          </article>
        </div>
      </div>
    </section>

    <section id="lien-he" class="section">
      <div class="container">
        <h2>Liên hệ</h2>
        <p>Email: ten@tenmien.com</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Tên website. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
